name: Generate contribution grid snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]         # refresh on each push to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: cocomber1234
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_bg=1f2937&color_base=7dd3fc&color_snake=ff6ec7

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
